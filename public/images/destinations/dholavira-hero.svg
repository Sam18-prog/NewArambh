<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="dhSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="40%" stop-color="#78350f"/>
      <stop offset="75%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="dhStone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e4d5b7"/>
      <stop offset="100%" stop-color="#9a8c73"/>
    </linearGradient>
    <linearGradient id="dhWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="750" fill="url(#dhSky)"/>

  <!-- Rann of Kutch Salt Flats Horizon -->
  <rect x="0" y="380" width="1200" height="120" fill="#f8fafc" opacity="0.35"/>
  <path d="M 0 460 Q 300 440 600 460 T 1200 450 L 1200 750 L 0 750 Z" fill="#713f12"/>

  <!-- Colossal Stone-Cut Reservoir System in Foreground -->
  <polygon points="120,520 1080,520 1000,720 200,720" fill="#54300a"/>
  <!-- Reservoir Water Pool -->
  <polygon points="220,550 980,550 920,700 280,700" fill="url(#dhWater)" opacity="0.85"/>
  <!-- Stepped Descent Stairs into Reservoir -->
  <g fill="#d4a373" opacity="0.7">
    <rect x="230" y="550" width="15" height="150"/>
    <rect x="250" y="570" width="15" height="130"/>
    <rect x="270" y="590" width="15" height="110"/>
  </g>

  <!-- Massive Harappan Stone Citadel & Castle Walls -->
  <rect x="280" y="310" width="640" height="160" fill="url(#dhStone)" rx="4"/>
  <rect x="260" y="280" width="80" height="190" fill="#b09f82" rx="4"/>
  <rect x="860" y="280" width="80" height="190" fill="#b09f82" rx="4"/>
  <!-- North Gateway Entrance of Citadel -->
  <rect x="560" y="360" width="80" height="110" fill="#292524"/>

  <!-- Recreated 10-Character Indus Signboard Motif (Above Gate) -->
  <g transform="translate(460, 315)">
    <rect x="0" y="0" width="280" height="34" fill="#1c1917" rx="3" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Schematic Glyphs -->
    <circle cx="25" cy="17" r="8" fill="#ffffff"/>
    <line x1="50" y1="8" x2="50" y2="26" stroke="#ffffff" stroke-width="3"/>
    <path d="M 70 8 L 85 17 L 70 26 Z" fill="#ffffff"/>
    <rect x="100" y="9" width="16" height="16" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="135" cy="17" r="7" fill="#ffffff"/>
    <line x1="155" y1="9" x2="170" y2="25" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="170" y1="9" x2="155" y2="25" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="195" cy="17" r="8" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <rect x="220" y="10" width="14" height="14" fill="#ffffff"/>
    <line x1="255" y1="8" x2="255" y2="26" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Middle Town & Lower Town Foundations -->
  <g fill="#8c7853" opacity="0.6">
    <rect x="60" y="420" width="180" height="60"/>
    <rect x="960" y="420" width="180" height="60"/>
  </g>

  <!-- Badges & Titles -->
  <rect x="50" y="50" width="350" height="42" rx="21" fill="#090505" fill-opacity="0.8" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="225" y="76" fill="#fef08a" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="2" text-anchor="middle">UNESCO WORLD HERITAGE #1642</text>
  <text x="50" y="680" fill="#ffffff" font-family="sans-serif" font-size="36" font-weight="900" letter-spacing="1">DHOLAVIRA: A HARAPPAN CITY</text>
  <text x="50" y="714" fill="#fde68a" font-family="sans-serif" font-size="18" font-weight="500">Kutch, Gujarat • c. 3000–1500 BCE • Indus Valley Civilisation</text>
</svg>
