<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#180e07"/>
      <stop offset="35%" stop-color="#3d1f0a"/>
      <stop offset="70%" stop-color="#8c4718"/>
      <stop offset="100%" stop-color="#e08638"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#ffd59e" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#b45309" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#180e07" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sandstoneWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8622c"/>
      <stop offset="50%" stop-color="#693b16"/>
      <stop offset="100%" stop-color="#2a1608"/>
    </linearGradient>
    <linearGradient id="sandstoneDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a250a"/>
      <stop offset="100%" stop-color="#150a03"/>
    </linearGradient>
    <radialGradient id="waterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="0.8"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#skyGrad)"/>
  <rect width="1600" height="900" fill="url(#sunGlow)"/>

  <!-- Distant Pavilions & Chhatris -->
  <g opacity="0.4" fill="#3b1d08">
    <path d="M720 420 Q800 340 880 420 L880 470 L720 470 Z"/>
    <rect x="740" y="470" width="12" height="70"/>
    <rect x="794" y="470" width="12" height="70"/>
    <rect x="848" y="470" width="12" height="70"/>
    <!-- Dome Finial -->
    <line x1="800" y1="340" x2="800" y2="305" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="800" cy="305" r="5" fill="#f59e0b"/>

    <!-- Left & Right Chhatris -->
    <path d="M420 460 Q480 390 540 460 L540 500 L420 500 Z"/>
    <rect x="440" y="500" width="10" height="50"/>
    <rect x="510" y="500" width="10" height="50"/>
    <path d="M1060 460 Q1120 390 1180 460 L1180 500 L1060 500 Z"/>
    <rect x="1080" y="500" width="10" height="50"/>
    <rect x="1150" y="500" width="10" height="50"/>
  </g>

  <!-- Central Monument Structure -->
  <g fill="url(#sandstoneWall)">
    <!-- Base Terraces -->
    <rect x="300" y="520" width="1000" height="30" rx="3"/>
    <rect x="340" y="490" width="920" height="30" rx="2"/>
    <rect x="380" y="460" width="840" height="30" rx="2"/>

    <!-- Grand Archway Facade -->
    <path d="M560 460 L560 280 Q800 170 1040 280 L1040 460 Z"/>
    <!-- Central Arch Cutout -->
    <path d="M660 460 L660 330 Q800 240 940 330 L940 460 Z" fill="url(#sandstoneDark)"/>

    <!-- Flanking Pillars & Colonnades -->
    <rect x="540" y="280" width="40" height="180"/>
    <rect x="1020" y="280" width="40" height="180"/>
    <rect x="420" y="320" width="30" height="140"/>
    <rect x="480" y="320" width="30" height="140"/>
    <rect x="1090" y="320" width="30" height="140"/>
    <rect x="1150" y="320" width="30" height="140"/>
  </g>

  <!-- Ornate Jharokha (Projected Balconies) -->
  <g fill="#d97706" opacity="0.9">
    <!-- Center Top Balcony -->
    <path d="M740 280 L720 320 L880 320 L860 280 Z"/>
    <rect x="730" y="320" width="140" height="25" fill="#92400e"/>
    <circle cx="760" cy="332" r="5" fill="#fef3c7"/>
    <circle cx="800" cy="332" r="5" fill="#fef3c7"/>
    <circle cx="840" cy="332" r="5" fill="#fef3c7"/>
  </g>

  <!-- Foreground Courtyard Ground & Stepwell Reservoir -->
  <path d="M0 550 L1600 550 L1600 900 L0 900 Z" fill="#1c0f05"/>

  <!-- Stepped Water Tank (Baori Basin) -->
  <g>
    <!-- Outer Step -->
    <polygon points="400,600 1200,600 1280,850 320,850" fill="#2d1709"/>
    <!-- Middle Step -->
    <polygon points="480,630 1120,630 1180,820 420,820" fill="#42210c"/>
    <!-- Inner Pool -->
    <polygon points="560,660 1040,660 1090,790 510,790" fill="url(#waterGlow)"/>

    <!-- Water Glow Ripple Rings -->
    <ellipse cx="800" cy="725" rx="180" ry="40" fill="none" stroke="#7dd3fc" stroke-width="1.5" opacity="0.6"/>
    <ellipse cx="800" cy="725" rx="110" ry="25" fill="none" stroke="#bae6fd" stroke-width="1" opacity="0.8"/>
  </g>

  <!-- Glowing Oil Lamps / Diya Ring along Step Edge -->
  <g>
    <circle cx="480" cy="630" r="16" fill="url(#lampGlow)"/>
    <circle cx="480" cy="630" r="3" fill="#ffffff"/>
    <circle cx="640" cy="630" r="16" fill="url(#lampGlow)"/>
    <circle cx="640" cy="630" r="3" fill="#ffffff"/>
    <circle cx="800" cy="630" r="20" fill="url(#lampGlow)"/>
    <circle cx="800" cy="630" r="4" fill="#ffffff"/>
    <circle cx="960" cy="630" r="16" fill="url(#lampGlow)"/>
    <circle cx="960" cy="630" r="3" fill="#ffffff"/>
    <circle cx="1120" cy="630" r="16" fill="url(#lampGlow)"/>
    <circle cx="1120" cy="630" r="3" fill="#ffffff"/>

    <!-- Floating Basin Lotus -->
    <circle cx="800" cy="725" r="28" fill="url(#lampGlow)"/>
    <polygon points="800,710 812,725 800,740 788,725" fill="#f43f5e"/>
    <circle cx="800" cy="725" r="5" fill="#fef08a"/>
  </g>

  <!-- Front Framing Silhouette Pillars -->
  <g fill="#0c0602">
    <!-- Left Grand Column -->
    <path d="M0 0 L140 0 L140 900 L0 900 Z"/>
    <path d="M140 0 Q240 180 140 360 L140 0 Z"/>
    <!-- Right Grand Column -->
    <path d="M1460 0 L1600 0 L1600 900 L1460 900 Z"/>
    <path d="M1460 0 Q1360 180 1460 360 L1460 0 Z"/>

    <!-- Upper Cusped Arch Trim -->
    <path d="M0 0 L1600 0 L1600 70 Q1200 140 800 70 Q400 140 0 70 Z"/>
  </g>
</svg>
