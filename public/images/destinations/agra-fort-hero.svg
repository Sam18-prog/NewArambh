<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="afSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="80%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="afSandstone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a83232"/>
      <stop offset="100%" stop-color="#581c1c"/>
    </linearGradient>
    <linearGradient id="afMarble" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="750" fill="url(#afSky)"/>

  <!-- Distant Yamuna River -->
  <path d="M 0 520 Q 300 490 600 520 T 1200 500 L 1200 620 L 0 620 Z" fill="#1e3a5f" opacity="0.6"/>

  <!-- Monumental Red Sandstone Ramparts (Semicircular curve) -->
  <path d="M 0 460 Q 400 420 800 440 L 1200 420 L 1200 750 L 0 750 Z" fill="url(#afSandstone)"/>

  <!-- Amar Singh Gate High Circular Bastion -->
  <path d="M 180 540 L 180 340 Q 280 310 380 340 L 380 540 Z" fill="#b91c1c"/>
  <rect x="250" y="420" width="60" height="120" fill="#2d0b0b" rx="30"/>

  <!-- Jahangiri Mahal Red Sandstone Palace Core -->
  <rect x="420" y="320" width="280" height="160" fill="#991b1b" rx="4"/>
  <polygon points="410,320 710,320 690,290 430,290" fill="#7f1d1d"/>

  <!-- White Marble Khas Mahal & Musamman Burj Projection -->
  <g transform="translate(760, 260)">
    <!-- Octagonal Tower (Musamman Burj) -->
    <polygon points="40,200 0,160 0,60 40,20 120,20 160,60 160,160 120,200" fill="url(#afMarble)"/>
    <circle cx="80" cy="18" r="30" fill="#f8fafc" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="76, -14 84, -14 80, -28" fill="#f59e0b"/>
    <!-- Jali Screen Window Arcades -->
    <rect x="40" y="70" width="80" height="80" fill="#1e293b" rx="4"/>
    <path d="M 50 150 L 50 100 Q 80 75 110 100 L 110 150 Z" fill="#0f172a"/>
  </g>

  <!-- Distant Taj Mahal Silhouette across the river -->
  <g transform="translate(1040, 420)" opacity="0.45">
    <ellipse cx="60" cy="20" rx="20" ry="24" fill="#ffffff"/>
    <rect x="45" y="24" width="30" height="35" fill="#ffffff"/>
    <rect x="15" y="20" width="6" height="40" fill="#ffffff"/>
    <rect x="99" y="20" width="6" height="40" fill="#ffffff"/>
  </g>

  <!-- Ground Shadows -->
  <rect x="0" y="580" width="1200" height="170" fill="#090505" opacity="0.9"/>

  <!-- Badges & Titles -->
  <rect x="50" y="50" width="340" height="42" rx="21" fill="#090505" fill-opacity="0.8" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="220" y="76" fill="#fef08a" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="2" text-anchor="middle">UNESCO WORLD HERITAGE #251</text>
  <text x="50" y="680" fill="#ffffff" font-family="sans-serif" font-size="36" font-weight="900" letter-spacing="1">AGRA FORT</text>
  <text x="50" y="714" fill="#fed7aa" font-family="sans-serif" font-size="18" font-weight="500">Agra, Uttar Pradesh • 1565–1573 CE • Akbar &amp; Shah Jahan</text>
</svg>
