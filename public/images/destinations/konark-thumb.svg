<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="sunWheel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="#1c0f05"/>
  <!-- Glowing Sun Disc -->
  <circle cx="400" cy="300" r="190" fill="url(#sunWheel)"/>
  <!-- Chariot Wheel Spokes -->
  <g stroke="#78350f" stroke-width="8" opacity="0.8">
    <circle cx="400" cy="300" r="160" fill="none" stroke-width="18"/>
    <circle cx="400" cy="300" r="50" fill="#451a03" stroke-width="12"/>
    <line x1="400" y1="140" x2="400" y2="460"/>
    <line x1="240" y1="300" x2="560" y2="300"/>
    <line x1="287" y1="187" x2="513" y2="413"/>
    <line x1="287" y1="413" x2="513" y2="187"/>
  </g>
</svg>
