<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="#0f172a"/>
  <!-- Geometric Descending Steps (Baori) -->
  <g fill="#475569">
    <!-- Top Step Row -->
    <polygon points="100,100 700,100 660,160 140,160" fill="#64748b"/>
    <!-- Triangular Step Pavilions -->
    <polygon points="200,160 250,230 300,160" fill="#94a3b8"/>
    <polygon points="350,160 400,230 450,160" fill="#94a3b8"/>
    <polygon points="500,160 550,230 600,160" fill="#94a3b8"/>

    <polygon points="180,230 620,230 580,290 220,290" fill="#475569"/>
    <polygon points="260,290 310,360 360,290" fill="#64748b"/>
    <polygon points="440,290 490,360 540,290" fill="#64748b"/>

    <polygon points="240,360 560,360 520,420 280,420" fill="#334155"/>
    <polygon points="340,420 400,480 460,420" fill="#475569"/>

    <!-- Central Sacred Pool -->
    <rect x="320" y="470" width="160" height="90" rx="6" fill="url(#stepGrad)"/>
    <ellipse cx="400" cy="515" rx="50" ry="20" fill="#38bdf8" opacity="0.6"/>
  </g>
</svg>
