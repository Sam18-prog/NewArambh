<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="thumbSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1408"/>
      <stop offset="60%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <radialGradient id="thumbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#thumbSky)"/>
  <circle cx="400" cy="300" r="240" fill="url(#thumbGlow)"/>
  
  <!-- Architectural Silhouette -->
  <g fill="#180a03">
    <!-- Main Archway -->
    <path d="M260 400 L260 220 Q400 120 540 220 L540 400 Z"/>
    <path d="M320 400 L320 250 Q400 180 480 250 L480 400 Z" fill="#431407"/>
    <!-- Dome on top -->
    <path d="M350 200 Q400 120 450 200 Z" fill="#b45309"/>
    <line x1="400" y1="120" x2="400" y2="90" stroke="#fef08a" stroke-width="3"/>
    <!-- Flanking Pillars -->
    <rect x="230" y="240" width="24" height="160"/>
    <rect x="546" y="240" width="24" height="160"/>
    <!-- Ground -->
    <rect x="0" y="400" width="800" height="200" fill="#0f0502"/>
    <!-- Pool Reflection -->
    <ellipse cx="400" cy="480" rx="160" ry="40" fill="#0369a1" opacity="0.4"/>
  </g>
</svg>
