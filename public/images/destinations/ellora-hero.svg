<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#1e293b"/>
  <!-- Canyon Rock Walls -->
  <polygon points="0,0 220,0 160,600 0,600" fill="#0f172a"/>
  <polygon points="800,0 580,0 640,600 800,600" fill="#0f172a"/>
  <!-- Monolithic Temple in Ravine -->
  <g fill="#334155">
    <rect x="320" y="320" width="160" height="180" rx="4"/>
    <!-- Shikhara Spire -->
    <polygon points="340,320 460,320 420,160 380,160" fill="#475569"/>
    <!-- Finial Amalka -->
    <ellipse cx="400" cy="155" rx="20" ry="8" fill="#e2e8f0"/>
    <rect x="0" y="500" width="800" height="100" fill="#020617"/>
  </g>
</svg>
