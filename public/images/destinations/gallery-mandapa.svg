<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#44403c"/>
    </linearGradient>
    <radialGradient id="lampM" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1c1917" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgM)"/>
  <circle cx="400" cy="240" r="280" fill="url(#lampM)"/>
  <!-- Mandapa Pillars -->
  <g fill="#78716c">
    <!-- Corbelled ceiling -->
    <polygon points="150,140 650,140 600,190 200,190" fill="#a8a29e"/>
    <polygon points="200,190 600,190 550,230 250,230" fill="#57534e"/>
    <!-- Central Octagonal Dome Rings -->
    <ellipse cx="400" cy="140" rx="180" ry="40" fill="#d97706" opacity="0.3"/>
    <ellipse cx="400" cy="140" rx="100" ry="25" fill="#fef3c7" opacity="0.5"/>
    <!-- Pillars -->
    <rect x="220" y="230" width="36" height="300" rx="4"/>
    <rect x="330" y="230" width="36" height="300" rx="4"/>
    <rect x="440" y="230" width="36" height="300" rx="4"/>
    <rect x="550" y="230" width="36" height="300" rx="4"/>
    <!-- Bases & Capitals -->
    <rect x="210" y="220" width="56" height="18" fill="#d6d3d1"/>
    <rect x="320" y="220" width="56" height="18" fill="#d6d3d1"/>
    <rect x="430" y="220" width="56" height="18" fill="#d6d3d1"/>
    <rect x="540" y="220" width="56" height="18" fill="#d6d3d1"/>
    <!-- Floor Plinth -->
    <rect x="100" y="520" width="600" height="80" fill="#292524"/>
  </g>
</svg>
